name: Check links

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths: [programs.yaml, scripts/check_links.py, .github/workflows/links.yml]

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    # External sites go down or block CI runners, so never block a pull request on this.
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pyyaml
      - run: python3 scripts/check_links.py --strict --discover
