name: Render README

on:
  push:
    branches: [main]
    paths: [programs.yaml, scripts/render.py, README.md, .github/workflows/render.yml]
  pull_request:
    paths: [programs.yaml, scripts/render.py, README.md, .github/workflows/render.yml]

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pyyaml
      - name: Validate data
        run: python3 scripts/render.py --validate
      # Contributors may edit only programs.yaml; README is rendered on main.
      # If a PR does touch README.md, its generated parts must match the data.
      - name: Check README is in sync (run scripts/render.py if this fails)
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          if git diff --name-only "$BASE_SHA" HEAD | grep -qx README.md; then
            python3 scripts/render.py --check
          fi
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

  render:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pyyaml
      - name: Render and commit
        run: |
          python3 scripts/render.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md
          git diff --cached --quiet || (git commit -m "Render README" && git push)
