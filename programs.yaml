# Felt / fields:
#   name        Firmanavn. Utelat for hemmelige program.
#               Company name. Omit for undisclosed programs.
#   url         Firmaets nettside. / Company website.
#   unit        Valgfritt. Datterselskap/merkevare, f.eks. FINN.no under Vend.
#               Optional. Subsidiary/brand, e.g. FINN.no under Vend.
#   unit_url    Valgfritt. / Optional.
#   platform    hackerone | intigriti | bugcrowd | yeswehack | synack | openbugbounty | none
#               none = eget program uten plattform. Mangler en plattform? Legg den til i scripts/render.py.
#               none = self-hosted, no platform. Missing a platform? Add it to scripts/render.py.
#   visibility  public | private-known | undisclosed
#               private-known = privat, men eksistensen er offentlig kjent
#               private-known = private, but publicly known to exist
#   type        bug-bounty | rdp | vdp | contact-only
#               contact-only = ingen policyside, bare en security.txt eller sikkerhetskontakt.
#               contact-only = no policy page, just a security.txt or a security contact.
#   program_url Valgfritt. Lenke til programmet. / Optional. Link to the program.
#   rewards     Liste av / list of: money | hall-of-fame | swag. Tom liste = ingen dusør. / Empty list = no reward.
#   launched    Valgfritt. ÅÅÅÅ eller ÅÅÅÅ-MM, eller "<= ÅÅÅÅ" hvis bare en øvre grense er kjent.
#               Optional. YYYY or YYYY-MM, or "<= YYYY" if only an upper bound is known.
#   source      Valgfritt. Lenke som dokumenterer programmet. / Optional. Link documenting the program.
#   source_name Valgfritt. Visningsnavn for kilden. / Optional. Display name for the source.
#   security_txt Valgfritt. Lenke til selskapets security.txt. / Optional. Link to the company's security.txt.
#   comment     Valgfritt. Kort fritekstnotat, f.eks. forbehold eller kontekst.
#               Optional. Short free-text note, e.g. a caveat or context.
#   status      Valgfritt. active (standard) | unknown | closed
#               Optional. active (default) | unknown | closed

